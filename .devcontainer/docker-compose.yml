services:
  gpu-service:
    image: elainasuki/other:isaac-uv
    container_name: isaac
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - OMP_WAIT_POLICY=passive
      - TERM=xterm-256color
      - ACCEPT_EULA=Y
      # - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      # - ROS_LOCALHOST_ONLY=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # - /home/${USER}/.Xauthority:/isaac-sim/.Xauthority
      - /dev:/dev
      - ./..:/home/Elaina/isaac
      # 挂载缓存目录
      - ./../cache/cache:/isaac-sim/kit/cache
      - ./../cache/logs:/isaac-sim/kit/logs
      - ./../cache/data:/isaac-sim/kit/data
      # - ./../cache/cache/kit:/isaac-sim/kit/cache
    runtime: "nvidia"
    tty: true
    network_mode: "host"
    user: 'Elaina'
    privileged: true
    stdin_open: true
    working_dir: "/home/Elaina/isaac" # 指定默认工作目录
    entrypoint: [ "sh", "-c", "zsh" ]
